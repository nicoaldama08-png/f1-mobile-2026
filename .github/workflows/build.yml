name: "Compilar APK F1 2026"

on:
  workflow_dispatch:

jobs:
  export-android:
    name: "Exportar APK Android"
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Generar Keystore de Depuracion
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\"" >> ~/.config/godot/editor_settings-4.tres || true

      - name: Instalar Godot 4 y Plantillas de Exportacion
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Compilar APK Android
        run: |
          mkdir -p build/android
          ./godot --headless --export-debug "Android" build/android/F1_2026.apk

      - name: Subir APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: F1-2026-Game-APK
          path: build/android/F1_2026.apk
