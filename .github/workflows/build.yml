name: "Compilar APK F1 2026"

on:
  workflow_dispatch:

jobs:
  export-android:
    name: "Exportar APK Android"
    runs-on: ubuntu-latest

    steps:
      - name: "Descargar repositorio"
        uses: actions/checkout@v4

      - name: "Instalar Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Instalar Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Configurar herramientas Android y Keystore"
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platforms;android-34"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mv debug.keystore /root/debug.keystore || mv debug.keystore $HOME/debug.keystore

      - name: "Descargar Godot Engine y Plantillas de Exportación"
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: "Compilar APK Android"
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/F1_Mobile_2026.apk

      - name: "Subir APK para Descarga"
        uses: actions/upload-artifact@v4
        with:
          name: F1-Mobile-2026-Android-APK
          path: build/android/F1_Mobile_2026.apk
