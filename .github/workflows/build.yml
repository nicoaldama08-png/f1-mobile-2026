name: "Compilar APK F1 2026"

on:
  workflow_dispatch:

jobs:
  export-android:
    name: "Exportar APK Android"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar Keystore de Depuracion
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          godot --headless --editor --quit || true
          echo "export/android/debug_keystore = \"/root/debug.keystore\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"/usr/lib/android-sdk\"" >> ~/.config/godot/editor_settings-4.tres

      - name: Compilar APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/F1_2026.apk

      - name: Subir APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: F1-2026-Game-APK
          path: build/android/F1_2026.apk
