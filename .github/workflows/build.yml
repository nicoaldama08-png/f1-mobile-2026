name: Compilar APK F1 2026

on:
  workflow_dispatch:

jobs:
  export:
    name: Exportar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias y configurar Keystore
        run: |
          yes | sdkmanager --licenses || true
          
          # Generar clave debug para firmar el APK
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /home/runner/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

          # Configurar Godot para que reconozca el SDK y la clave
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "/home/runner/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Descargar Godot Engine y Plantillas
        run: |
          GODOT_VERSION="4.2.2-stable"
          
          # Descargar ejecutable de Godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 godot
          chmod +x godot

          # Descargar plantillas e instalar en la ruta 4.2.2.stable
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      - name: Compilar APK Android
        run: |
          mkdir -p build/android
          ./godot --headless --export-debug "Android" build/android/f1-mobile-2026.apk

      - name: Subir APK para Descarga
        uses: actions/upload-artifact@v4
        with:
          name: f1-mobile-2026-apk
          path: build/android/f1-mobile-2026.apk
